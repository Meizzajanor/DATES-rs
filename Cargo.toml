[workspace]
members = [
  "crates/dates-core",
  "crates/dates-cli",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
clap = { version = "4.5.50", features = ["derive"] }
nalgebra = "0.34.1"
num-complex = "0.4.6"
predicates = "3.1.3"
rand = "0.9.2"
rand_chacha = "0.9.0"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
